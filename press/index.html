<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format('woff2');font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:Tinos;font-weight:400;src:url(fonts/tinos-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Tinos;font-weight:700;src:url(fonts/tinos-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Tinos;font-weight:400;font-style:italic;src:url(fonts/tinos-latin-400-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Tinos;font-weight:700;font-style:italic;src:url(fonts/tinos-latin-700-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Tinos;font-weight:400;src:url(fonts/tinos-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2113,U+2116,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Tinos;font-weight:700;src:url(fonts/tinos-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2113,U+2116,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Tinos;font-weight:400;font-style:italic;src:url(fonts/tinos-latin-ext-400-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2113,U+2116,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Tinos;font-weight:700;font-style:italic;src:url(fonts/tinos-latin-ext-700-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2113,U+2116,U+2C60-2C7F,U+A720-A7FF}

:root{--times:'Times New Roman',Tinos,Times,serif;--anton:Anton,Impact,sans-serif;--ink:#18202c;--bar:#10161f;--card:#222c3a;--line:#2e3a4b;--txt:#eef2f7;--dim:#93a1b5;--acc:#6aa8ff;--red:#ff5d5d;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--ink);overscroll-behavior:none;overflow:hidden}
#view{position:fixed;left:0;right:0;top:calc(54px + var(--top));bottom:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(70px + var(--bot))}
body.kb #view{padding-bottom:60vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

/* header */
#hd{position:fixed;left:0;right:0;top:0;z-index:30;padding:var(--top) 6px 0;height:calc(54px + var(--top));display:flex;align-items:center;gap:4px;background:var(--bar);border-bottom:1px solid var(--line)}
.hb{height:40px;min-width:38px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.hb:active{background:var(--card)}
.hb:disabled{opacity:.3}
.hb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#isb{font-size:16px;padding:0 8px}
#isb .dot{width:7px;height:7px;border-radius:50%;background:#56637a;margin-left:2px}
#isb .dot.ok{background:#4cd08a}#isb .dot.wait{background:#f2b84b}
.seg{flex:1;display:flex;justify-content:center}
.seg>div{display:flex;background:var(--card);border-radius:9px;padding:3px}
.seg button{height:32px;padding:0 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--txt);color:var(--bar)}
#xb{color:var(--acc)}

/* page */
#wrap{position:relative;margin:8px auto}
#pg{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 4px 24px rgba(0,0,0,.35)}
body.arr #pg{touch-action:none;-webkit-user-select:none;user-select:none}

.sheet{position:relative;width:794px;height:1123px;overflow:hidden;background:#fff;color:#000;font-family:var(--times)}
.sheet .mast{position:absolute;left:185.7px;top:37.2px;width:418.3px;height:72.3px}
.sheet .stamp{position:absolute;left:659.7px;top:11.4px;width:101px;height:89.9px}
.sheet .addr{position:absolute;left:20px;top:34px;width:160px;font:16px/22px var(--times);text-transform:uppercase;white-space:pre-line}
.sheet .ibar{position:absolute;left:15.5px;top:113.8px;width:756px;height:29.6px;border-top:1.3px solid #000;border-bottom:1.3px solid #000;display:flex;align-items:center;padding:0 3px 0 9px;font:16px/1 var(--times)}
.sheet .ibar span{flex:1;white-space:nowrap}
.sheet .ibar span:nth-child(2){flex:2;text-align:center;text-transform:uppercase}
.sheet .ibar span:nth-child(3){text-align:right}
.sheet .blk{position:absolute;overflow:hidden}
.sheet .blk.fl{z-index:2}
.sheet .tx{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;font-size:16px;line-height:1.15;text-align:justify;white-space:pre-wrap;overflow-wrap:break-word;outline:none;color:#000}
.sheet .tx div{min-height:1px}
.sheet .tx img.em{display:inline;height:.92em;width:auto;vertical-align:-.12em;margin-left:.1em}
.sheet .blk.p img{position:absolute;max-width:none;display:block}
.sheet .lns i{position:absolute;background:#000;display:block}

/* live-only page bits */
.live .tx[contenteditable=true]{cursor:text}
.live .tx div.e[data-ph]{position:relative}
.live .tx div.e[data-ph]::before{content:attr(data-ph);position:absolute;left:0;top:0;right:0;opacity:.42;pointer-events:none;white-space:nowrap;overflow:hidden}
.live .blk.p .ph{position:absolute;left:0;top:0;right:0;bottom:0;background:#eef1f5;border:2px dashed #b4bccb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 15px/1.2 -apple-system,sans-serif;color:#6b778a;text-align:center}
.live .blk.p .ph svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6}
.live .meta{cursor:pointer}
.live .ibar .th:empty::before{content:'Tap to set the theme';opacity:.35;text-transform:none;font-style:italic}
body.write .live .blk.p{cursor:pointer}
body.write .live .blk.sel{outline:3px solid #2f7cf6;outline-offset:2px}
body.write .live .blk.ed{outline:1.5px dashed #2f7cf6;outline-offset:3px;overflow:visible}
body.write .live .blk.ed .tx{overflow:visible}
.ovl{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.ovl b{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,0);background:var(--red);color:#fff;font:700 11px/1 -apple-system,sans-serif;padding:4px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ovl b i{font-style:normal;opacity:.85;margin-left:4px}
.ovl s{position:absolute;height:0;border-bottom:2px dashed var(--red)}
.gridov{position:absolute;left:9.5px;top:141px;width:768px;height:976px;pointer-events:none;display:none;background-image:repeating-linear-gradient(90deg,rgba(47,124,246,.07) 0 52px,transparent 52px 64px);background-position:6px 0}
body.arr .gridov{display:block}
body.arr .live .blk{outline:1.5px dashed #8fa6c8;outline-offset:-1px;background:rgba(47,124,246,.05)}
body.arr .live .blk .tx{pointer-events:none}
body.arr .live .blk.bad{outline:2px solid var(--red)}
body.arr .live .blk.fl{outline-color:#9b51e0;background:rgba(155,81,224,.06)}
body.write .live .blk.p.sel{touch-action:none;cursor:move}
body.arr .live .blk.mv{opacity:.55;z-index:3}
.selov{position:absolute;border:2.5px solid #2f7cf6;pointer-events:none;z-index:5;--k:1}
.selov b{position:absolute;width:calc(30px*var(--k));height:calc(30px*var(--k));margin:calc(-15px*var(--k)) 0 0 calc(-15px*var(--k));border-radius:50%;background:#2f7cf6;border:calc(3px*var(--k)) solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:auto;touch-action:none}
.selov b[data-h=n]{left:50%;top:0;margin-top:calc(-34px*var(--k))}.selov b[data-h=s]{left:50%;top:100%;margin-top:calc(4px*var(--k))}.selov b[data-h=w]{left:0;top:50%;margin-left:calc(-34px*var(--k))}.selov b[data-h=e]{left:100%;top:50%;margin-left:calc(4px*var(--k))}.selov b[data-h=se]{left:100%;top:100%;margin:calc(4px*var(--k)) 0 0 calc(4px*var(--k));border-radius:4px}
.ghost{position:absolute;border:2.5px dashed #18a058;background:rgba(24,160,88,.10);pointer-events:none;z-index:6}
.ghost.no{border-color:var(--red);background:rgba(255,107,107,.15)}
.ghost span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--k,1));font:700 13px -apple-system,sans-serif;color:#fff;background:rgba(16,22,31,.85);padding:5px 9px;border-radius:8px;white-space:nowrap}

/* bottom bar */
#bb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + var(--bot));min-height:calc(62px + var(--bot));background:var(--bar);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
#bb .hint{flex:1;font-size:13px;color:var(--dim);line-height:1.3}
.btn{height:44px;padding:0 14px;border-radius:10px;background:var(--card);border:0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{filter:brightness(1.25)}
.btn.pri{background:var(--acc);color:#0b1422}
.btn.dng{color:var(--red)}
.btn.on{background:var(--txt);color:var(--bar)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bb .btn{flex:1;padding:0 8px}
#bb .btn.sm{flex:0 0 auto}

/* format toolbar */
#fmt{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-top:1px solid var(--line);padding-bottom:var(--bot);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.kb #fmt{padding-bottom:0}
.frow{display:flex;align-items:stretch;height:50px;padding:0 4px;gap:2px}
.frow button{flex:1;min-width:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin:5px 0}
.frow button.on{background:var(--card);color:#fff}
.frow button.act{background:var(--txt);color:var(--bar)}
.frow button.act img{filter:none!important}
.frow button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.frow .w2{flex:1.3;font-size:14px;font-weight:600}
.frow .w2 small{font-size:10px;margin-left:1px;opacity:.7}
.frow .done{flex:1.35;background:var(--acc);color:#0b1422;font-size:15px;font-weight:700}
#ffam{font-family:var(--times);font-size:16px}
#ffam.a{font-family:var(--anton);letter-spacing:.03em}
.fpan{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-height:56px}
.fpan .stp{width:44px;height:44px;border-radius:10px;background:var(--card);font-size:24px;font-weight:500;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.fpan .val{flex:1;text-align:center;font-weight:700;font-size:16px}
.fpan .val small{display:block;font-size:11px;font-weight:500;color:var(--dim)}
.scrub{flex:1;position:relative;height:52px;overflow:hidden;border-radius:10px;background:#0b1018;touch-action:none;cursor:ew-resize}
.scrub .rul{position:absolute;left:50%;top:24px;height:24px;pointer-events:none;background:repeating-linear-gradient(90deg,#c9d3e1 0 2px,transparent 2px 40px) 0 0/100% 24px no-repeat,repeating-linear-gradient(90deg,#5d6b80 0 1px,transparent 1px 8px) 0 10px/100% 14px no-repeat}
.scrub .ndl{position:absolute;left:50%;top:20px;bottom:0;width:2px;margin-left:-1px;background:var(--acc);border-radius:1px}
.scrub .sv{position:absolute;left:0;right:0;top:4px;text-align:center;font-weight:700;font-size:14px;pointer-events:none}
.scrub .sv small{font-weight:500;color:var(--dim);margin-left:4px;font-size:12px}
.scrub::before,.scrub::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:1;pointer-events:none}
.scrub::before{left:0;background:linear-gradient(90deg,#0b1018,transparent)}.scrub::after{right:0;background:linear-gradient(-90deg,#0b1018,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;height:32px;min-width:42px;padding:0 10px;border-radius:16px;background:var(--card);font-size:14px;font-weight:600}
.stl{flex:1;height:42px;border-radius:10px;background:var(--card);font-size:15px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#1c2533;border:0;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + var(--bot));animation:up .2s ease-out}
@media (min-width:700px){.scrim{align-items:center}.panel{border-radius:16px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.panel h3{margin:0 0 12px;font:700 19px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:space-between}
.panel h3 .x{width:34px;height:34px;border-radius:50%;background:var(--card);font:600 18px -apple-system,sans-serif}
.panel p{margin:0 0 12px;color:var(--dim)}
.panel label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.panel input,.panel textarea{width:100%;font:16px/1.3 -apple-system,sans-serif;color:var(--txt);background:#121924;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel textarea{resize:none}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1}
.err{color:var(--red)!important}
.ilist{list-style:none;margin:12px 0;padding:0}
.ilist li{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.ilist li.cur{border-color:var(--acc)}
.ilist .n{font:700 17px/1 -apple-system,sans-serif;min-width:48px}
.ilist .m{flex:1;min-width:0}
.ilist .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ilist .m small{color:var(--dim)}
.tag{font-size:11px;font-weight:700;background:var(--acc);color:#0b1422;border-radius:5px;padding:1px 5px;vertical-align:2px}
.ilist .del{width:40px;height:40px;border-radius:10px;color:var(--dim)}
.ilist .del svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.acct{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0 4px}
.lays button{padding:8px 6px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.lays button:active,.lays button.on{border-color:var(--acc)}
.mini{position:relative;width:72px;height:102px;background:#fff;border-radius:2px}
.mini i{position:absolute;border:1px solid #9aa6b8}
.mini i.p{background:#c9d1dc}
.mini u{position:absolute;left:4px;right:4px;top:4px;height:14px;border-bottom:1px solid #000}
.lnsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{width:100%;height:52px;font-size:16px}
.note{font-size:13px;color:var(--dim)}
.pubx{margin-top:14px;padding:12px;border-radius:12px;background:#151d29}.pubx>b{display:block;margin-bottom:4px}.pubx .note{margin:0 0 8px}

/* crop */
#crop{position:fixed;inset:0;z-index:60;background:#0b0f15;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#crop .ct{padding:calc(14px + var(--top)) 16px 8px;text-align:center;color:var(--dim);font-size:14px}
#crop .cst{flex:1;position:relative;overflow:hidden;touch-action:none}
#crop .cfr{position:absolute;box-shadow:0 0 0 100vmax rgba(11,15,21,.75);outline:2px solid #fff;pointer-events:none}
#crop .cfr::before,#crop .cfr::after{content:'';position:absolute;inset:0;border:solid rgba(255,255,255,.35);border-width:0 1px}
#crop .cfr::before{left:33.33%;right:33.33%}
#crop .cfr::after{border-width:1px 0;top:33.33%;bottom:33.33%}
#crop img{position:absolute;max-width:none;pointer-events:none}
#crop .crect{position:absolute;box-shadow:0 0 0 100vmax rgba(11,15,21,.72);outline:2px solid #fff;cursor:move;touch-action:none}
#crop .crect::before,#crop .crect::after{content:'';position:absolute;inset:0;pointer-events:none;border:solid rgba(255,255,255,.35);border-width:0 1px;left:33.33%;right:33.33%}
#crop .crect::after{border-width:1px 0;left:0;right:0;top:33.33%;bottom:33.33%}
#crop .crect b{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none;z-index:1}
#crop .crect b::after{content:'';position:absolute;left:13px;top:13px;width:18px;height:18px;border:4px solid #fff;border-radius:3px;background:rgba(0,0,0,.25)}
#crop .crect b[data-h=nw]{left:0;top:0}#crop .crect b[data-h=n]{left:50%;top:0}#crop .crect b[data-h=ne]{left:100%;top:0}#crop .crect b[data-h=e]{left:100%;top:50%}
#crop .crect b[data-h=se]{left:100%;top:100%}#crop .crect b[data-h=s]{left:50%;top:100%}#crop .crect b[data-h=sw]{left:0;top:100%}#crop .crect b[data-h=w]{left:0;top:50%}
#crop .crect.lock b[data-h=n],#crop .crect.lock b[data-h=e],#crop .crect.lock b[data-h=s],#crop .crect.lock b[data-h=w]{display:none}
#crop .asp{padding:0}#crop .asp button{flex:0 0 auto}#crop .asp button.on{background:var(--txt);color:var(--bar)}
.rotr{display:flex;align-items:center;gap:8px}.rotr input{flex:1;accent-color:var(--acc);height:32px}.rotr span{min-width:44px;text-align:center;font-size:13px;color:var(--dim)}.rotr .btn{height:38px;padding:0 10px;font-size:14px}
#crop img{transform-origin:50% 50%}
#crop .cnote{margin:0;text-align:center;font-size:13px;color:var(--dim);min-height:18px}
#crop .cb{padding:10px 12px calc(12px + var(--bot));display:flex;flex-direction:column;gap:10px;background:var(--bar)}
#crop .zr{display:flex;align-items:center;gap:10px;color:var(--dim)}
#crop input[type=range]{flex:1;accent-color:var(--acc);height:30px}

#toast{position:fixed;left:50%;bottom:calc(80px + var(--bot));transform:translateX(-50%);z-index:70;background:#eef2f7;color:#10161f;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;max-width:92vw}
#toast button{color:#1d63d8;font-weight:800}
#printhost{position:absolute;left:0;top:0;z-index:-10;pointer-events:none}
.busy{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font:600 18px -apple-system,sans-serif}

/* ================= Printing Department theme: retro, utilitarian, a little corporate ================= */
@font-face{font-family:'Plex Mono';font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Plex Mono';font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Plex Mono';font-weight:600;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Plex Sans';font-weight:400;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Plex Sans';font-weight:500;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Plex Sans';font-weight:600;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-display:swap}
:root{--desk:#002454;--desk2:#00183c;--bone:#ece6d6;--bone2:#e2dac6;--paper:#f6f2e8;--ink:#00183c;--teal:#00609c;--teal2:#006ca8;--green:#3c7830;--green2:#488430;--mint:#a6dc84;--gold:#d8c060;--rule:#b9b09a;--mut:#6a6352;--red:#c2410c;
 --ui:'Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'Plex Mono',ui-monospace,Menlo,Consolas,monospace;--txt:var(--ink);--dim:var(--mut);--acc:var(--teal);--card:var(--bone2);--bar:var(--bone);--line:var(--rule)}
html{background:var(--desk)}
body{font-family:var(--ui);color:var(--ink);background:var(--desk)}
.mono,.lbl{font-family:var(--mono)}
#view{background:radial-gradient(ellipse at 50% 35%,#003c6c 0%,var(--desk) 55%,var(--desk2) 100%) fixed}
#view::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(166,220,132,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(166,220,132,.045) 1px,transparent 1px);background-size:24px 24px}
#view::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#wrap{z-index:1}
#pg{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.55)}

/* header: a control strip */
#hd{background:var(--bone);border-bottom:2px solid var(--ink);box-shadow:0 3px 0 var(--teal),0 6px 0 var(--green);color:var(--ink);gap:6px}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 0 2px;flex:0 0 auto}
.brand img{width:32px;height:32px;border-radius:7px;box-shadow:0 0 0 1.5px var(--ink)}
.brand .bt{display:flex;flex-direction:column;line-height:1.05}
.brand b{font:600 13px var(--mono);letter-spacing:.22em}
.brand small{font:500 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.hb{color:var(--ink);border-radius:6px}
.hb:active{background:var(--bone2)}
#isb{font:600 15px var(--mono);letter-spacing:.04em;white-space:nowrap;flex:0 0 auto;padding:0 6px;gap:4px}
#isb .dot{width:8px;height:8px;background:#a39a84;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#isb .dot.ok{background:#488430;box-shadow:0 0 6px #6aa84a}#isb .dot.wait{background:#d8c060;box-shadow:0 0 6px #d8c060}
.seg>div{background:var(--bone2);border:1.5px solid var(--ink);border-radius:7px;padding:2px}
.seg button{font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);height:32px;border-radius:5px;padding:0 11px}
.seg button.on{background:var(--green);color:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
#xb{background:var(--teal);color:var(--paper);border:1.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);height:36px}
#xb:active{transform:translateY(2px);box-shadow:none}
#xb .lbl{display:none;font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:400px){.brand .bt{display:none}.brand img{width:28px;height:28px}}
@media (max-width:360px){.brand{display:none}}

/* buttons: typewriter keys */
.btn{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;box-shadow:0 2px 0 var(--ink);font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:none;filter:none}
.btn.pri{background:var(--teal);color:var(--paper)}
.btn.dng{color:var(--red)}
.btn.on{background:var(--green);color:#fff}
.btn:disabled{opacity:.5}

/* bottom control panel */
#bb{background:var(--bone);border-top:2px solid var(--ink);box-shadow:0 -3px 0 var(--teal),0 -6px 0 var(--green)}
#bb .hint{font:500 11.5px/1.35 var(--mono);color:var(--mut);letter-spacing:.02em}
#bb .hint::before{content:'▸ ';color:var(--green)}

/* typing toolbar */
#fmt{background:var(--bone);border-top:2px solid var(--ink);box-shadow:0 -3px 0 var(--teal),0 -6px 0 var(--green);color:var(--ink)}
.frow button{color:var(--ink);border-radius:5px}
.frow button.on{background:var(--bone2);box-shadow:inset 0 0 0 1.5px var(--ink)}
.frow button.act{background:var(--green);color:#fff}
.frow button.act img{filter:invert(1)!important}
.frow .w2{font-family:var(--mono)}
.frow .done{background:var(--teal);color:var(--paper);border:1.5px solid var(--ink);font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.frow [data-f=em] img{filter:none!important}
.fpan{border-bottom:1px solid var(--rule)}
.fpan .stp{background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);color:var(--ink);font-family:var(--mono)}
.fpan .stp:active{transform:translateY(2px);box-shadow:none}
.chips button,.stl{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--mono);font-size:12.5px}
.stl.inv{background:var(--ink);color:#fff}
.chips button:active,.stl:active{background:var(--bone2)}
/* scrubber: a little CRT readout */
.scrub{background:#001230;border:1.5px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 14px rgba(0,0,0,.7)}
.scrub .rul{background:repeating-linear-gradient(90deg,rgba(166,220,132,.95) 0 2px,transparent 2px 40px) 0 0/100% 24px no-repeat,repeating-linear-gradient(90deg,rgba(166,220,132,.45) 0 1px,transparent 1px 8px) 0 10px/100% 14px no-repeat}
.scrub .ndl{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.scrub .sv{color:var(--mint);font-family:var(--mono);text-shadow:0 0 6px rgba(166,220,132,.6)}
.scrub .sv small{color:rgba(166,220,132,.6)}
.scrub::before{background:linear-gradient(90deg,#001230,transparent)}.scrub::after{background:linear-gradient(-90deg,#001230,transparent)}

/* sheets */
.scrim{background:rgba(0,14,36,.62)}
.panel{background:var(--bone);color:var(--ink);border:2px solid var(--ink);border-bottom:0;box-shadow:0 -6px 30px rgba(0,0,0,.35)}
@media (min-width:700px){.panel{border-bottom:2px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.35)}}
.panel h3{font:600 13px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding-bottom:10px;border-bottom:3px double var(--ink)}
.panel h3 .x{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-size:14px}
.panel p{color:var(--mut)}
.panel label{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.panel input,.panel textarea{background:#fbf8f0;border:1.5px solid var(--ink);border-radius:5px;color:var(--ink);font-family:var(--ui)}
.panel input:focus,.panel textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.note{color:var(--mut)}.err{color:var(--red)!important}
.pubx{background:var(--bone2);border:1.5px solid var(--rule)}
.ilist li{background:var(--paper);border:1.5px solid var(--rule);border-radius:7px}
.ilist li.cur{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--teal),inset 8px 0 0 var(--green)}
.ilist .n{font:600 15px var(--mono)}
.ilist .m small{color:var(--mut);font-family:var(--mono);font-size:11px}
.ilist .del{color:var(--mut)}
.tag{background:var(--green);color:var(--paper);font-family:var(--mono);border-radius:3px}
.lays button{background:var(--paper);border:1.5px solid var(--rule);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.lays button:active,.lays button.on{border-color:var(--ink)}
.mini{box-shadow:0 0 0 1px var(--ink)}
.acct{border-top:1px solid var(--rule)}
.motto{margin:18px 0 4px;text-align:center;font:500 10px/1.6 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.motto i{font:italic 13px var(--times);letter-spacing:0;text-transform:none}

/* toasts and busy screen: terminal messages */
#toast{background:var(--ink);color:var(--mint);font:500 12.5px var(--mono);letter-spacing:.03em;border:1.5px solid var(--green2);border-radius:6px;text-shadow:0 0 6px rgba(166,220,132,.45);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#toast button{color:var(--gold);text-transform:uppercase;font-size:11.5px;letter-spacing:.1em}
.busy{background:rgba(0,20,52,.88);color:var(--mint);font:600 14px var(--mono);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 8px rgba(166,220,132,.6)}
.busy::after{content:'▌';margin-left:4px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* crop screen */
#crop{background:var(--desk2)}
#crop .ct{color:var(--mint);font:500 12px var(--mono);letter-spacing:.06em}
#crop .cb{background:var(--bone);border-top:2px solid var(--ink)}
.rotr span{color:var(--ink);font-family:var(--mono)}
.rotr input{accent-color:var(--teal)}
#crop .asp button.on{background:var(--green);color:#fff}
#crop .cnote{color:var(--mut);font-family:var(--mono);font-size:11.5px}

/* arranging boxes */
.selov{border-color:var(--teal2)}
.selov b{background:var(--teal2)}
body.arr .live .blk{outline-color:rgba(0,96,156,.6)}

/* zoom control */
#zm{position:fixed;z-index:25;right:12px;bottom:calc(78px + var(--bot));display:none;align-items:center;gap:4px;background:var(--bone);border:1.5px solid var(--ink);border-radius:8px;padding:3px;box-shadow:0 3px 0 var(--ink)}
#zm button{height:30px;min-width:30px;padding:0 8px;border-radius:5px;font:600 13px var(--mono);color:var(--ink)}
#zm button:active{background:var(--bone2)}
#zm span{font:600 11.5px var(--mono);min-width:44px;text-align:center}
#zm .zf{background:var(--green);color:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#zm.on{display:flex}
#zm.on>button:not(.zf),#zm.on>span{display:none}
body.kb #zm{display:none!important}

/* ================= desktop: issues on the left, page in the middle, tools on the right ================= */
#rail{display:none}
body.desk #rail{display:block;position:fixed;z-index:20;left:0;top:calc(54px + var(--top));bottom:0;width:280px;overflow:auto;background:var(--bone2);border-right:2px solid var(--ink);padding:14px 14px 20px}
#rail .rh{font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin:2px 0 12px;padding-bottom:8px;border-bottom:3px double var(--ink)}
#rail .btn.big{width:100%}
#rail input{display:block;width:100%;font:15px var(--ui);color:var(--ink);background:#fbf8f0;border:1.5px solid var(--ink);border-radius:5px;padding:9px 10px;margin:0}
#rail input:focus{outline:2px solid var(--teal);outline-offset:1px}
#rail .acct .btn{width:100%;margin-top:8px}
#rail .ilist li{cursor:pointer}
#rail .ilist li:hover{border-color:var(--ink)}
body.desk #isb{display:none}
body.desk #xb .lbl{display:inline}
body.desk #view{left:280px;right:300px;padding-bottom:20px}
body.desk #bb,body.desk #fmt{top:calc(54px + var(--top));left:auto;right:0;bottom:0;width:300px;min-height:0;border-top:0;border-left:2px solid var(--ink);box-shadow:none;transform:none!important;overflow:auto;padding:16px 14px 20px}
body.desk #bb{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px}
body.desk #bb .btn{flex:0 0 auto;width:100%;height:46px}
body.desk #bb .hint{flex:0 0 auto;font-size:12px;padding:10px 12px;background:var(--bone2);border:1.5px solid var(--rule);border-radius:7px}
body.desk #bb::before{content:'Control panel';font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;padding-bottom:8px;border-bottom:3px double var(--ink)}
body.desk #fmt{display:flex;flex-direction:column}
body.desk #fmt[hidden]{display:none!important}
body.desk #fmt::before{content:'Typesetting';order:-2;font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;padding-bottom:8px;margin-bottom:10px;border-bottom:3px double var(--ink)}
body.desk .frow{order:-1;flex-wrap:wrap;height:auto;padding:0;gap:6px}
body.desk .frow button{flex:1 1 calc(25% - 6px);height:42px;margin:0;border:1.5px solid var(--ink);background:var(--paper)}
body.desk .frow .w2,body.desk .frow .done{flex-basis:calc(50% - 6px)}
body.desk .frow .done{background:var(--teal);color:var(--paper);box-shadow:0 2px 0 var(--ink)}
body.desk .frow [data-f=size],body.desk .frow [data-f=ls],body.desk .frow [data-f=lh],body.desk .frow [data-f=st],body.desk .frow [data-f=em]{display:none}
body.desk #fpan{margin-top:8px}
body.desk .fpan{padding:4px 0 6px;border:0}
body.desk .chips{padding:0 0 4px;flex-wrap:wrap}
body.desk .chips button{flex:1 1 auto}
.dsec{margin:10px 0 6px}
.dl{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.dgrid .stl{height:40px}
.dfoot{font:500 11px/1.45 var(--mono);color:var(--mut);margin:14px 0 0}
body.desk #zm{display:flex;right:316px;bottom:18px}
body.desk #zm.on>button:not(.zf),body.desk #zm.on>span{display:inline-flex;align-items:center;justify-content:center}
body.desk #toast{bottom:28px;left:calc(280px + (100vw - 580px)/2)}
</style>
</head>
<body class="write">
<header id="hd">
 <div class="brand"><img src="icon-192.png" alt=""><div class="bt"><b>RAG&nbsp;PRESS</b><small>Printing Dept.</small></div></div>
 <button class="hb" id="isb" aria-label="Issues"><svg viewBox="0 0 24 24" style="width:20px"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="isn">№ 1</span><i class="dot" id="sdot"></i></button>
 <div class="seg"><div><button id="mw" class="on">Write</button><button id="ma">Arrange</button></div></div>
 <button class="hb" id="ub" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
 <button class="hb" id="rb" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
 <button class="hb" id="xb" aria-label="Export"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span class="lbl">Export</span></button>
</header>

<div id="view"><div id="wrap"><div id="pg"></div></div></div>
<div id="zm"><button data-z="out" aria-label="Zoom out">−</button><span id="zv">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit" class="zf">Fit page</button></div>
<div id="bb"></div>
<div id="fmt" hidden>
 <div id="fpan" hidden></div>
 <div class="frow">
  <button data-f="b" aria-label="Bold"><b style="font-family:var(--times);font-size:19px">B</b></button>
  <button data-f="i" aria-label="Italic"><i style="font-family:var(--times);font-size:19px">I</i></button>

  <button data-f="size" class="w2" aria-label="Font size"><span id="fsz">11</span><small>pt</small></button>
  <button data-f="ls" aria-label="Letter spacing"><svg viewBox="0 0 24 24"><path d="M7 4l-3 9h6l-3-9zM5 10h4M14 4v9M14 4h3a2.5 2.5 0 0 1 0 5h-3M14 9h3.5a2 2 0 0 1 0 4H14"/><path d="M3 19h18M6 17l-3 2 3 2M18 17l3 2-3 2"/></svg></button>
  <button data-f="lh" aria-label="Line spacing"><svg viewBox="0 0 24 24"><path d="M11 6h10M11 12h10M11 18h10M5 4v16M2.5 6.5 5 4l2.5 2.5M2.5 17.5 5 20l2.5-2.5"/></svg></button>
  <button data-f="al" aria-label="Alignment"><svg viewBox="0 0 24 24" id="alic"><path d="M3 6h18M3 10h18M3 14h18M3 18h18"/></svg></button>
  <button data-f="st" aria-label="Paragraph styles" style="font-family:var(--times);font-size:21px">¶</button>
  <button data-f="em" aria-label="End mark"><img src="emblem.png" alt="" style="height:20px;filter:invert(1)"></button>
  <button data-f="done" class="done">Done</button>
 </div>
</div>
<input type="file" id="fi" accept="image/*" hidden><input type="file" id="fp" accept="application/pdf,.pdf" hidden>
<div id="printhost"></div>

<script src="lib/supabase.js"></script>
<script>
'use strict';
// The Riley Rag's own Supabase project (the same one the Rag app signs in to)
const RAG={url:'https://vikxpnxnbmhmawhnwxzl.supabase.co',key:'sb_publishable_0WwmJLwgxP4uSQF8TDdaOw_vrL-XU6x'};
// ---------- page geometry (A4 at 96 px per inch) ----------
const PW=794,PH=1123,COLS=12,ROWS=52,GX=9.5,GY=141,CU=64,RH=976/52,HG=12,VG=10;
const TIMES="'Times New Roman',Tinos,Times,serif",ANTON='Anton,Impact,sans-serif';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const now=()=>Date.now(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const box=b=>({l:GX+b.x*CU+HG/2,t:GY+b.y*RH+VG/2,w:b.w*CU-HG,h:b.h*RH-VG});
const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const pd=d=>{const[y,m,dd]=(d||'').split('-').map(Number);return y?{y,m,d:dd}:null};
const longDate=d=>{const p=pd(d);return p?`${p.d} ${MONTHS[p.m-1][0]+MONTHS[p.m-1].slice(1).toLowerCase()} ${p.y}`:''};
const dotDate=d=>{const p=pd(d);return p?`${String(p.d).padStart(2,'0')}.${String(p.m).padStart(2,'0')}.${p.y}`:''};
const iso=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

// ---------- story templates ----------
const PAR=(st,ph)=>`<div style="${st}" data-ph="${ph}"><br></div>`;
const ST={

const dimsOf=im=>{const a=(im.rot||0)*Math.PI/180,c=Math.abs(Math.cos(a)),n=Math.abs(Math.sin(a));return{w:im.w*c+im.h*n,h:im.w*n+im.h*c}};

function derive(im){const k=imKey(im);if(IMG[k])return Promise.resolve();if(!IMG[im.id])return loadImg(im.id).then(()=>IMG[im.id]&&derive(im));

function syncSoon(id){id=id||(I&&I.id);if(DOCS[id]&&DOCS[id].play)return;dirty.add(id);if(!canSync())return;dot('wait');clearTimeout(syncT);syncT=setTimeout(sync,1800)}
function adopt(d){const isCur=I&&I.id===d.id;if(isCur&&ED)edited(ED);const m=isCur?merge(I,d):merge(DOCS[d.id],d);m._sync=d._sync;DOCS[d.id]=m;dbPut('docs',JSON.parse(JSON.stringify(m)));if(isCur){I=m;render()}}
async function sync(){if(!canSync()||syncing)return;syncing=true;dot('wait');
 try{const{data:list,error}=await sb.from('rag_drafts').select('id,updated_at');if(error)throw error;const srv={};for(const r of list)srv[r.id]=r.updated_at;
  for(const r of list){const loc=DOCS[r.id];if(loc&&loc._sync===r.updated_at)continue;const{data}=await sb.from('rag_drafts').select('doc,updated_at').eq('id',r.id).single();if(!data)continue;const d={...data.doc,_sync:data.updated_at};
   const before=loc?JSON.stringify(strip(loc)):'';adopt(d);if(loc&&JSON.stringify(strip(DOCS[r.id]))!==JSON.stringify(strip(d)))dirty.add(r.id)}
  for(const id in DOCS)if(!srv[id]&&!DOCS[id].play)dirty.add(id);
  for(const id of [...dirty]){const d=DOCS[id];dirty.delete(id);if(!d||d.play)continue;const{data,error}=await sb.from('rag_drafts').upsert({id,doc:strip(d),updated_at:new Date().toISOString(),updated_by:ME.id}).select('updated_at').single();if(error){dirty.add(id);throw error}
   const cur=DOCS[id];cur._sync=data.updated_at;dbPut('docs',JSON.parse(JSON.stringify(cur)))}
  await upImgs();dot(dirty.size?'wait':'ok');
  if(!I||I.gone){const n=live()[0];if(n)openDoc(n.id)}}
 catch(e){dot('');console.warn('sync',e)}finally{syncing=false}}
let upT=null;function upSoon(){clearTimeout(upT);upT=setTimeout(upImgs,1500)}
async function upImgs(){if(!canSync())return;const all=await dbAll('imgs');const used=new Set();for(const d of Object.values(DOCS)){if(d.pdf){used.add(d.pdf.id);used.add(d.pdf.pv)}for(const b of Object.values(d.b))if(b.im)used.add(b.im.id)}
 for(const r of all){if(r.up||!used.has(r.id))continue;const{error}=await sb.storage.from('issues').upload(`drafts/${r.id}.${r.blob.type=='application/pdf'?'pdf':'jpg'}`,r.blob,{contentType:r.blob.type||'image/jpeg',upsert:false});if(!error||/exists|duplicate/i.test(error.message)){r.up=1;await dbPut('imgs',r)}}}
function acct(){const el=$('#acct');if(!el)return;
 if(!sb){el.innerHTML='<p class="note">Sharing isn’t available right now. Your work is saved on this device.</p>';return}
 if(!ME){el.innerHTML=`<p class="note">Sign in with your Riley Rag account to share drafts with each other and publish straight to the Rag.</p><form id="lg"><input id="lg-e" type="email" autocomplete="username" placeholder="Email" required><input id="lg-p" type="password" autocomplete="current-password" placeholder="Password" required style="margin-top:8px"><p class="err" id="lg-x"></p><button class="btn pri big">Sign in</button></form>`;
  el.querySelector('#lg').onsubmit=async e=>{e.preventDefault();const x=el.querySelector('#lg-x');x.textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:el.querySelector('#lg-e').value.trim(),password:el.querySelector('#lg-p').value});if(error){x.textContent=error.message;return}await who();acct();sync()};return}
 el.innerHTML=`<p class="note">Signed in as <b>${esc(ME.name)}</b>. ${ME.ed?'Drafts are shared with the other editors, and you can publish.':'Only Riley Rag editors can share drafts and publish.'}</p><button class="btn" id="lg-o">Sign out</button>`;
 el.querySelector('#lg-o').onclick=async()=>{await sb.auth.signOut();ME=null;localStorage.removeItem('rp_me');dot('');purgeShared();acct()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')sync();else saveNow()});
addEventListener('online',()=>sync());setInterval(()=>{if(document.visibilityState=='visible')sync()},20000);
addEventListener('pagehide',saveNow);

// ---------- zoom: pinch on phones, ctrl/⌘ + scroll or the zoom buttons on desktop ----------
function zoomUI(){const z=$('#zm');if(!z)return;$('#zv').textContent=Math.round(S/FIT*100)+'%';z.classList.toggle('on',UZ)}
function zoomAt(s,cx,cy,px,py){s=clamp(s,Math.min(FIT,.25),4);const r=$('#pg').getBoundingClientRect();if(px==null){px=(cx-r.left)/S;py=(cy-r.top)/S}
 setScale(s);const r2=$('#pg').getBoundingClientRect();VIEW.scrollLeft+=r2.left+px*s-cx;VIEW.scrollTop+=r2.top+py*s-cy;UZ=Math.abs(s-FIT)>.005;zoomUI()}
function zoomBy(f){const r=VIEW.getBoundingClientRect();zoomAt(S*f,r.left+r.width/2,r.top+r.height/2)}
$('#zm').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset.z;if(z=='fit'){fit();return}zoomBy(z=='in'?1.2:1/1.2)});
VIEW.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoomAt(S*Math.exp(-clamp(e.deltaY,-60,60)*.006),e.clientX,e.clientY)},{passive:false});
let PIN=null;
function cancelDrag(){if(!DRAG)return;const d=DRAG;DRAG=null;SH&&SH.querySelector('.ghost')?.remove();if(d.el){d.el.classList.remove('mv');d.el.style.transform=''}render()}
VIEW.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;if(MODE=='w'&&e.target.closest&&e.target.closest('.blk.p.sel'))return;
 const[a,b]=e.touches,mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2,r=$('#pg').getBoundingClientRect();
 PIN={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:S,px:(mx-r.left)/S,py:(my-r.top)/S};cancelDrag();e.preventDefault()},{passive:false});
VIEW.addEventListener('touchmove',e=>{if(!PIN||e.touches.length!==2)return;e.preventDefault();const[a,b]=e.touches;
 zoomAt(PIN.s*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/PIN.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,PIN.px,PIN.py)},{passive:false});
VIEW.addEventListener('touchend',e=>{if(e.touches.length<2)PIN=null});
document.addEventListener('gesturestart',e=>e.preventDefault());
// arrange drags ignore a second finger (that's a pinch)
$('#pg').addEventListener('pointerdown',e=>{if(PIN)cancelDrag()},true);

// ---------- desktop: issues rail on the left, tools on the right ----------
function deskMode(){const was=isDesk(),on=innerWidth>=1024&&matchMedia('(pointer:fine)').matches||innerWidth>=1180;document.body.classList.toggle('desk',on);
 if(was!==on){renderRail(true);const fp=$('#fpan');fp.dataset.k='';if(ED){if(on)deskPan();else{fp.hidden=true;fp.innerHTML=''}}if(I)bar()}}
document.addEventListener('keydown',e=>{const t=e.target,typing=t&&t.closest&&(t.closest('.tx')||/INPUT|TEXTAREA|SELECT/.test(t.tagName)),mod=e.metaKey||e.ctrlKey,k=e.key;
 if($('.scrim')||$('#crop')){if(k=='Escape'){close();$('#crop')&&$('#crop').remove()}return}
 if(mod&&(k=='='||k=='+')){e.preventDefault();zoomBy(1.2);return}
 if(mod&&k=='-'){e.preventDefault();zoomBy(1/1.2);return}
 if(mod&&k=='0'){e.preventDefault();fit();return}
 if(mod&&!typing&&k.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(k=='Escape'){if(ED){ED.blur();return}if(SEL){SEL=null;render()}return}
 if(typing||MODE!='a'||!SEL||!I.b[SEL])return;const b=I.b[SEL];
 if(k=='Backspace'||k=='Delete'){e.preventDefault();delBlock(SEL);return}
 const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];if(!dir)return;e.preventDefault();
 const st=b.fl?.25:1,r={x:b.x+dir[0]*st,y:b.y+dir[1]*st,w:b.w,h:b.h};
 if(e.shiftKey){r.x=b.x;r.y=b.y;r.w=Math.max(st,b.w+dir[0]*st);r.h=Math.max(st,b.h+dir[1]*st)}
 if(!free(r,b.id,b.fl))return toast('That would overlap another box.');snap();Object.assign(b,r,{t:now()});changed();render()});

// ---------- start ----------
(async()=>{deskMode();try{for(const d of await dbAll('docs'))DOCS[d.id]=d}catch(e){toast('This browser won’t let the app save. Export copies as you go.')}
 let cid=null;try{cid=localStorage.getItem('rp_cur')}catch(e){}
 if(!cid||!live().includes(DOCS[cid]))cid=(live()[0]||{}).id;
 if(!cid)cid=makeDoc('classic').id;
 openDoc(cid);dot(canSync()?'ok':'');
 await who();sync();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
