<script>
// ====== 1. PASTE YOUR SUPABASE VALUES (Project Settings > API) ======
const SUPABASE_URL = 'https://vikxpnxnbmhmawhnwxzl.supabase.co';

// ---------- themes: the editors pick one look for everybody (stored in rr_settings) ----------
const THEMES = [['leather','Classic leather'],['xmas','Christmas']];
let THEME = (() => { try { return localStorage.getItem('rr_theme') || 'leather'; } catch(e){ return 'leather'; } })();
function applyTheme(t){ if(!THEMES.some(x => x[0] === t)) t = 'leather'; THEME = t; const h = document.documentElement;
 THEMES.forEach(([k]) => h.classList.toggle('th-' + k, k === t && k !== 'leather')); try{ localStorage.setItem('rr_theme', t); }catch(e){}
 const b = document.getElementById('thb'); if(b) b.textContent = 'Theme: ' + THEMES.find(x => x[0] === t)[1]; }
sb.from('rr_settings').select('value').eq('key','theme').maybeSingle().then(({data}) => { if(data && data.value) applyTheme(data.value); }, () => {});
async function nextTheme(){ const i = THEMES.findIndex(x => x[0] === THEME), t = THEMES[(i + 1) % THEMES.length][0]; applyTheme(t);
 const {error} = await sb.from('rr_settings').upsert({key:'theme', value:t}); if(error) alert('Couldn’t save the theme for everyone: ' + error.message); }

async function pushSub(){ if(!CAN_PUSH()) return null; const r = await navigator.serviceWorker.getRegistration(); return r && r.pushManager.getSubscription(); }
async function alertsOn(){
 try{
  const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  if(await Notification.requestPermission() !== 'granted') return 'Your phone said no to alerts. You can allow them later in Settings → Notifications → Riley Rag.';
  const u = VAPID_PUBLIC_KEY.replace(/-/g,'+').replace(/_/g,'/'), raw = atob(u + '='.repeat((4 - u.length % 4) % 4));
  const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:Uint8Array.from(raw, c => c.charCodeAt(0))}), j = sub.toJSON();
  const { error } = await sb.from('rr_push_subs').upsert({endpoint:j.endpoint, user_id:me.id, sub:j}, {onConflict:'endpoint'});
  return error ? error.message : null;
 }catch(x){ return x.message || 'Could not turn on alerts.'; }
}
async function alertsOff(){ const s = await pushSub(); if(s){ await sb.from('rr_push_subs').delete().eq('endpoint', s.endpoint); await s.unsubscribe(); } }

// ---- Remembering readers: name + email are kept on this device (and in a cookie as a backup),
// so if the browser ever forgets the session we sign them straight back in without asking.
const WHO_K = 'rr_who';
function who(){ try{ const v = localStorage.getItem(WHO_K); if(v) return JSON.parse(v); }catch(e){}
 const m = document.cookie.match(/(?:^|; )rr_who=([^;]*)/); try{ return m ? JSON.parse(decodeURIComponent(m[1])) : null; }catch(e){ return null; } }
function saveWho(name, email){ const v = JSON.stringify({name, email}); try{ localStorage.setItem(WHO_K, v); }catch(e){}
 document.cookie = `rr_who=${encodeURIComponent(v)}; max-age=${400*864e2}; path=/RileyRag/; SameSite=Lax; Secure`;
 try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
function forgetWho(){ try{ localStorage.removeItem(WHO_K); }catch(e){} document.cookie = 'rr_who=; max-age=0; path=/RileyRag/'; }
async function quickLogin(name, email){   // true, 'editor', or an error message
 try{
  const { data, error } = await sb.functions.invoke('rr-login', { body:{ name, email } });
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j.editor) return 'editor'; m = j.error || m; }catch(x){} return m; }
  if(data.editor) return 'editor';
  let v = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'magiclink' });
  if(v.error) v = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'email' });
  if(v.error) return v.error.message;
  saveWho(name, email); return true;
 }catch(x){ return navigator.onLine === false ? 'You’re offline. Connect to the internet and try again.' : (x.message || 'Couldn’t sign in. Please try again.'); }
}

 const [cn, vw] = await Promise.all([sb.rpc('reaction_counts'), me.is_editor ? sb.from('issue_views').select('issue_id,last_at,n,profiles(name)') : Promise.resolve({data:null})]);
 RXC = {}; (cn.data||[]).forEach(x => RXC[x.issue_id+'|'+x.kind] = x.n);

let RXC = {}, VIEWS = [];
const seen = new Set(), viewObs = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { const id = +en.target.dataset.iss;
 if(en.isIntersecting && !seen.has(id)){ seen.add(id); viewObs.unobserve(en.target); sb.rpc('saw_issue', {iid:id}).then(() => {}, () => {}); act('read', {key:id, n:en.target.dataset.n}); } }), {threshold:.5}) : null;
const ago = t => { const d = (Date.now() - new Date(t)) / 864e5; return d < 1 ? 'today' : d < 2 ? 'yesterday' : d < 30 ? Math.floor(d)+' days ago' : new Date(t).toLocaleDateString(); };
function issueEl(is, cs, rs){
 const el = document.createElement('article'); el.className='issue';
 const d = new Date(is.issue_date+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
 el.innerHTML = `<button class="sheet" aria-label="Open issue ${is.number} full size"><img loading="lazy" src="${pub(is.img_path)}" alt="The Riley Rag, Issue ${is.number}, ${d}"></button>
 <div class="rxs"></div><div class="who" hidden></div>${me.is_editor?'<button class="btn ghost seen"></button><div class="who seenl" hidden></div>':''}<div class="cms"></div>
 <form><label class="sr" for="c${is.id}">Leave a comment</label><textarea id="c${is.id}" rows="2" maxlength="1000" placeholder="Leave a comment…" required></textarea><button class="btn">Post comment</button><p class="err"></p></form>`;
 el.querySelector('.sheet').onclick = () => { $('#lbimg').src = pub(is.img_path); $('#lbpdf').href = pub(is.pdf_path); $('#lb').classList.add('on'); if(!me.is_editor){ sb.rpc('saw_issue', {iid:is.id}).then(() => {}, () => {}); act('read', {key:is.id, n:is.number}); } };
 if(!me.is_editor && viewObs){ el.querySelector('.sheet').dataset.iss = is.id; el.querySelector('.sheet').dataset.n = is.number; viewObs.observe(el.querySelector('.sheet')); }
 if(me.is_editor){   // who has read this issue
  const v = VIEWS.filter(x => x.issue_id === is.id).sort((a,b) => new Date(b.last_at) - new Date(a.last_at)), sb2 = el.querySelector('.seen'), sl = el.querySelector('.seenl');
  sb2.textContent = v.length ? `👁 Read by ${v.length} ${v.length===1?'person':'people'} ▾` : '👁 Nobody has opened this one yet';
  sl.innerHTML = v.map(x => `<div><b>${esc(x.profiles?.name||'Someone')}</b><small>${ago(x.last_at)}${x.n>1?` · ${x.n} times`:''}</small></div>`).join('');
  sb2.onclick = () => { if(v.length){ sl.hidden = !sl.hidden; sb2.textContent = sb2.textContent.replace(/[▾▴]$/, sl.hidden?'▾':'▴'); } };
 }
 const rx = el.querySelector('.rxs'), whoBox = el.querySelector('.who');
 let openKind = null;
 const drawRx = () => {
  rx.innerHTML = '';
  Object.entries(RX).forEach(([k,[label,svg]]) => {
   const mine = rs.some(x => x.issue_id===is.id && x.kind===k && x.user_id===me.id);
   const n = RXC[is.id+'|'+k] || 0;
   const b = document.createElement('button'); b.className='rx'; b.setAttribute('aria-pressed',mine);
   b.setAttribute('aria-label',label+(n?`, ${n}`:'')); b.title = label;
   b.innerHTML = `${svg}${n?`<span>${n}</span>`:''}`;
   if(me.is_editor){   // editors don't react; they see who did
    b.setAttribute('aria-pressed', openKind===k); b.setAttribute('aria-expanded', openKind===k);
    b.onclick = () => { openKind = openKind===k ? null : k; drawRx(); };
    rx.append(b); return;
   }
   b.onclick = async () => {
    b.disabled = true;
    const {error} = mine ? await sb.from('reactions').delete().match({issue_id:is.id,user_id:me.id,kind:k}) : await sb.from('reactions').insert({issue_id:is.id,kind:k});
    if(error){ b.disabled = false; return alert(error.message); }
    if(mine){ const i = rs.findIndex(x => x.issue_id===is.id && x.kind===k && x.user_id===me.id); if(i>-1) rs.splice(i,1); RXC[is.id+'|'+k] = Math.max(0, n-1); }
    else { rs.push({issue_id:is.id, user_id:me.id, kind:k}); RXC[is.id+'|'+k] = n+1; act('react', {n:is.number, label}); }
    drawRx(); [...rx.children].find(c => c.title===label)?.focus({preventScroll:true});
   };
   rx.append(b);
  });
  if(me.is_editor){
   const names = openKind ? rs.filter(x => x.issue_id===is.id && x.kind===openKind).map(x => x.profiles?.name || 'Someone').sort((a,b) => a.localeCompare(b)) : [];
   whoBox.hidden = !openKind;
   if(openKind) whoBox.innerHTML = `<div class="whoh">${RX[openKind][1]}<span>${esc(RX[openKind][0])}</span></div>` + (names.length ? names.map(n => `<div>${esc(n)}</div>`).join('') : '<div><i>Nobody yet</i></div>');
  }
 };
 drawRx();
 const box = el.querySelector('.cms');
 const addComment = x => {
  const c = document.createElement('div'); c.className='cm';
  c.innerHTML = `${me.is_editor?'<button class="del" aria-label="Delete comment">Delete</button>':''}<b>${esc(x.profiles?.name||'Someone')}</b><small>${new Date(x.created_at).toLocaleDateString()}</small><div>${esc(x.body)}</div>`;
  if(me.is_editor) c.querySelector('.del').onclick = async () => { if(confirm('Delete this comment?')){ const {error} = await sb.from('comments').delete().eq('id',x.id); if(error) alert(error.message); else c.remove(); } };
  box.append(c);
 };
 cs.filter(x => x.issue_id===is.id).forEach(addComment);
 el.querySelector('form').onsubmit = async e => {
  e.preventDefault(); const ta = el.querySelector('textarea'), er = el.querySelector('.err'); er.textContent = '';
  const {data, error} = await sb.from('comments').insert({issue_id:is.id, body:ta.value.trim()}).select('*,profiles(name)').single();
  if(error) return er.textContent = error.message;
  act('comment', {n:is.number, text:ta.value.trim()}); ta.value = ''; addComment(data);
 };
 return el;
}

// ---------- Map: where each issue of the Rag was published ----------
// The coastlines are Natural Earth (public domain), drawn with the Natural Earth projection. Each issue
// with a place gets a little rolled-up newspaper; issues from the same place share one roll.

const NE = (lng, lat) => { const l = lng*Math.PI/180, f = lat*Math.PI/180, f2 = f*f, f4 = f2*f2;

         MAPD.ty - MAPD.k * f * (1.007226 + f2*(0.015085 + f4*(-0.044475 + 0.028874*f2 - 0.005916*f4)))]; };

const MICO = {back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>', plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>', minus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>', x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>', home:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3.2 3 13.8 0 17M12 3.5c-3 3.2-3 13.8 0 17"/></svg>'};
// The map fills the whole screen with no words on it: just the world, the medallions, and a few round buttons.
// Speed and sharpness: the world is drawn only for what's on screen (plus a margin). While a finger moves,
// that picture just slides and stretches (a GPU transform, smooth on phones); when it stops, the visible
// part is redrawn at the new zoom, so it's always crisp. Medallions are small HTML buttons placed on top. Ones that would
// overlap on screen merge into one, with a count, and split apart again as you zoom in.

 const [md, res] = await Promise.all([MAPD ? Promise.resolve(MAPD) : fetch('map.json').then(r => r.json()), sb.from('issues').select('id,number,issue_date,img_path,pdf_path,place,lat,lng').order('number')]);
 MAPD = md; const fs = $('#mapfs'), layer = $('#mlayer'), svg = $('#msvg'), pinsEl = $('#mpins'); if(!fs) return;

 for(let lng = -150; lng <= 180; lng += 30){ let s = ''; for(let lat = -58; lat <= 85; lat += 4){ const [x, y] = NE(lng, lat); s += (s ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } gr += s; }

 const place = () => { const els = pinsEl.children; for(let n = 0; n < els.length; n++){ const c = CL[n]; els[n].style.transform = `translate3d(${((px + c.x*z) * u).toFixed(1)}px,${((py + c.y*z) * u).toFixed(1)}px,0)`; } };
 let raf = 0, settleT = 0;
 const draw = () => { clampV(); const k = z / z0; layer.style.transform = `translate3d(${(px - k*px0)*u}px,${(py - k*py0)*u}px,0) scale(${k})`; if(Math.abs(Math.log(z / (clZ || 1))) > .18 || clZ < 0) cluster(); place(); };
 const frame = () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
 // while moving, let the GPU slide the picture; afterwards, redraw it crisply and re-merge the medallions
 const moving = () => { fs.classList.add('moving'); clearTimeout(settleT); settleT = setTimeout(() => { fs.classList.remove('moving'); render(); cluster(); place(); }, 160); };
 const zoomAt = (f, cx, cy) => { const nz = Math.min(18, Math.max(zmin(), z*f)); px = cx - (cx - px) * nz / z; py = cy - (cy - py) * nz / z; z = nz; moving(); frame(); };
 const toUnits = (cx, cy) => { const r = fs.getBoundingClientRect(); return [(cx - r.left) / u, (cy - r.top) / u]; };
 const tall = () => VH > VW * 1.2 ? VH * .5 / H : 0;
 const fit = (pts, pad) => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const bw = Math.max(160, Math.max(...xs) - Math.min(...xs)) * pad, bh = Math.max(100, Math.max(...ys) - Math.min(...ys)) * pad;
  z = Math.min(7, Math.max(zmin(), tall(), Math.min(VW / bw, VH / bh))); const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2; px = VW/2 - cx*z; py = VH/2 - cy*z; clZ = -1; clampV(); render(); draw(); };
 const world = () => { if(tall()) return fit(placed.length ? placed.map(i => i.xy) : [[W*.52, H*.38]], 1); z = Math.max(zmin(), Math.min(VW / W, VH / H)); px = 0; py = 0; clZ = -1; clampV(); render(); draw(); };
 const fmt = d => new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
 const pop = L => { open = L.map(i => i.id); const el = $('#mpop'), places = [...new Set(L.map(i => i.place).filter(Boolean))];
  el.innerHTML = `<div class="mcard"><button class="mbtn mx" aria-label="Close">${MICO.x}</button>${places.length ? `<div class="mplace">${esc(places.join(' · '))}</div>` : ''}${L.slice().sort((a, b) => b.number - a.number).map(i => `<button class="mis" data-id="${i.id}"><img src="${pub(i.img_path)}" alt="" loading="lazy"><span><b>Issue № ${i.number}</b><small>${fmt(i.issue_date)}${places.length > 1 && i.place ? ' · ' + esc(i.place) : ''}</small></span></button>`).join('')}</div>`;
  el.classList.add('on'); fs.classList.add('popon');
  el.querySelector('.mx').onclick = () => { el.classList.remove('on'); fs.classList.remove('popon'); open = null; pinsEl.querySelectorAll('.mpin').forEach(q => q.classList.remove('on')); };
  el.querySelectorAll('.mis').forEach(b => b.onclick = () => { const is = L.find(i => i.id == b.dataset.id); $('#lbimg').src = pub(is.img_path); $('#lbpdf').href = pub(is.pdf_path); $('#lb').classList.add('on'); if(!me.is_editor){ sb.rpc('saw_issue', {iid:is.id}).then(() => {}, () => {}); act('read', {key:is.id, n:is.number}); } }); };
 // drag to pan, pinch to zoom
 const P = new Map(); let pinch = null, moved = 0;
 fs.addEventListener('pointerdown', e => { if(e.target.closest('.mbtn,#mpop')) return; P.set(e.pointerId, [e.clientX, e.clientY]); if(P.size === 1) moved = 0; if(P.size === 2){ const [a, b] = [...P.values()]; pinch = {d: Math.hypot(a[0]-b[0], a[1]-b[1]), z}; } });
 const mv = e => { if(!P.has(e.pointerId)) return; const old = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
  if(P.size === 2 && pinch){ const [a, b] = [...P.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]), [cx, cy] = toUnits((a[0]+b[0])/2, (a[1]+b[1])/2); zoomAt(pinch.z * d / pinch.d / z, cx, cy); moved = 99; return; }
  moved += Math.abs(e.clientX - old[0]) + Math.abs(e.clientY - old[1]); px += (e.clientX - old[0]) / u; py += (e.clientY - old[1]) / u; moving(); frame(); };
 const up = e => { if(!P.has(e.pointerId)) return; P.delete(e.pointerId); if(P.size < 2) pinch = null; };
 const rs = () => { if(!$('#mapfs')) return; const cx = (VW/2 - px) / z, cy = (VH/2 - py) / z; size(); px = VW/2 - cx*z; py = VH/2 - cy*z; clZ = -1; clampV(); render(); draw(); };
 if(window.mapOff) mapOff(); addEventListener('pointermove', mv, {passive:true}); addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('resize', rs);
 window.mapOff = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); removeEventListener('resize', rs); document.body.classList.remove('mapfull'); };
 fs.addEventListener('wheel', e => { if(e.target.closest('#mpop')) return; e.preventDefault(); const [cx, cy] = toUnits(e.clientX, e.clientY); zoomAt(Math.exp(-Math.max(-60, Math.min(60, e.deltaY)) * .006), cx, cy); }, {passive:false});
 fs.addEventListener('dblclick', e => { if(e.target.closest('.mbtn,#mpop,.mpin')) return; const [cx, cy] = toUnits(e.clientX, e.clientY); zoomAt(2, cx, cy); });
 $('#mzi').onclick = () => zoomAt(1.8, VW/2, VH/2); $('#mzo').onclick = () => zoomAt(1/1.8, VW/2, VH/2); $('#mzw').onclick = () => { moving(); world(); };
 if(ed) $('#medit').onclick = () => mapPlaces(all, res.error);
 size(); if(placed.length) fit(placed.map(i => i.xy), 2.4); else world();
}
// Editors: put issues on the map (new issues from Rag Press arrive with their place already set).
function mapPlaces(all, err){
 const d = sheet(`<h3 class="hd" style="text-align:center">Places</h3>${err ? '<p class="note">Run rr_map_peter.sql in Supabase to switch the map on.</p>' : `<p class="note" style="text-align:center">Type where an issue was published, e.g. “Brussels, Belgium”, and tap Find.</p>
 ${all.slice().reverse().map(i => `<div class="mrow" data-id="${i.id}"><b>№ ${i.number}</b><input value="${esc(i.place || '')}" placeholder="Where was it published?" aria-label="Place for issue ${i.number}"><button class="btn">Find</button><small>${i.lat != null ? '● on the map' : '○ not on the map'}</small></div>`).join('')}`}<div class="bar"><button class="btn ghost" data-x>Done</button></div>`);
 d.querySelectorAll('.mrow').forEach(r => { const b = r.querySelector('button'), inp = r.querySelector('input'), msg = r.querySelector('small');
  const go = async () => { const q = inp.value.trim(); if(!q){ await sb.from('issues').update({place:null, lat:null, lng:null}).eq('id', r.dataset.id); msg.textContent = '○ not on the map'; return; }
   b.disabled = true; msg.textContent = 'Looking…'; const hit = await geocode(q); b.disabled = false;
   if(!hit) return msg.textContent = 'Couldn’t find that place. Try adding the country.';
   const {error} = await sb.from('issues').update({place:q, lat:hit.lat, lng:hit.lng}).eq('id', r.dataset.id); msg.textContent = error ? error.message : '● on the map'; };
  b.onclick = go; inp.onkeydown = e => { if(e.key === 'Enter') go(); }; });
 d.querySelector('.bar [data-x]').addEventListener('click', () => mapView());
}
async function geocode(q){   // OpenStreetMap's free place search; used only when an editor sets a place
 try{ const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {headers:{'Accept-Language':'en'}}); const j = await r.json();
  return j[0] ? {lat:+(+j[0].lat).toFixed(4), lng:+(+j[0].lon).toFixed(4)} : null; } catch(e){ return null; }
}
async function recipesView(){
 app.innerHTML = `<h2 class="hd gilt ph">Riley Recipes</h2>${me.is_editor?'<div class="bar"><button class="btn" id="ra">Add a recipe card</button></div>':''}<div id="tools"></div><div id="rf">Loading…</div>`;

   e.preventDefault(); $('#re').textContent = 'Uploading…';

    const pg = await pdf.getPage(1), vp = pg.getViewport({scale: 1400/pg.getViewport({scale:1}).width});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await pg.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    const img = await new Promise(r => cv.toBlob(r,'image/jpeg',.85)), id = crypto.randomUUID();
    const pdfPath = `recipes/${id}.pdf`, imgPath = `recipes/${id}.jpg`;

    u = await sb.storage.from('issues').upload(imgPath, img, {contentType:'image/jpeg'}); if(u.error) throw u.error;
    const {error} = await sb.from('recipes').insert({name:$('#rn').value.trim()||null, pdf_path:pdfPath, img_path:imgPath});
    if(error) throw error; recipesView();
   }catch(x){ $('#re').textContent = x.message || String(x); }
  };
 };
 const {data, error} = await sb.from('recipes').select('*').order('created_at',{ascending:false});
 if(error) return $('#rf').textContent = error.message;
 $('#rf').innerHTML = data.length ? '' : '<p style="text-align:center">No recipe cards yet. Something delicious is coming!</p>';

  el.querySelector('.sheet').onclick = () => { $('#lbimg').src = pub(r.img_path); $('#lbpdf').href = pub(r.pdf_path); $('#lb').classList.add('on'); };
  if(me.is_editor) el.querySelector('.rd').onclick = async () => { if(confirm('Delete this recipe card?')){ await sb.from('recipes').delete().eq('id',r.id); recipesView(); } };
  $('#rf').append(el);
 });
}

function linkify(t){   // t is already HTML-escaped; turns http(s):// and www. addresses into tappable links
 return t.replace(/(https?:\/\/|www\.)[^\s<>"']+/g, m => {
  const tail = (m.match(/(&quot;|&#39;|&gt;|&lt;|[.,;:!?)\]])+$/) || [''])[0], url = m.slice(0, m.length - tail.length);
  return `<a href="${url.startsWith('www.') ? 'https://' + url : url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
 });
}
